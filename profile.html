<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Profile</title>
    <link rel="manifest" href="pwa-manifest.json" />
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="default.css">

</head>
<body>
    <div class="layout">
        <!-- sidebar -->
        <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
            <div class="sidebar-inner">
            <div class="brand">
                <img width="250" viewBox="0 0 175 111" src="my-icons/powrlogo.png">
            </div>

            <nav class="navlinks" role="navigation" aria-label="Main navigation">
                <a href="profile.html" class="navbtn">Profile</a>
                <a href="workout.html" class="navbtn">Workout</a>
                <a href="calendar.html" class="navbtn">Calendar</a>
                <a href="inventory.html" class="navbtn">Inventory</a>
                <a href="resources.html" class="navbtn">Resources</a>
                <a href="community.html" class="navbtn">Community</a>
                <a href="coach.html" class="navbtn">Coach</a>
            </nav>
            </div>
        </aside>

        <!-- MAIN -->
        <main id="app" class="app" role="main">
            <!-- Profile / Hero -->
            <section class="profile">
                <div class="profile-card">
                    <div class="avatar">
                        <img src="my-icons/profileimg.jpg" alt="Empty profile picture icon" class="avatar-img">
                    </div>
                    <div class="profile-text">
                        <h1 id="username">User12345</h1>
                        <p id="userlevel">PoWRlevel 20</p>
                    </div>
                </div>
            </section>
            
            <!-- DASHBOARD PANELS -->
            <section class="dashboard" aria-live="polite">
                <div class="panel">
                    <div class="panel-head">
                        <h2>Wilks Score Graph</h2>
                        <button class="info" id="wilksInfo" title="Wilks score measures relative strength adjusted for body weight">i</button>
                    </div>
                    <div class="chart-wrap">
                        <canvas id="wilksChart" aria-label="Wilks score chart" role="img"></canvas>
                    </div>
                </div>

                <div class="panel">
                    <h2>Total</h2>
                    <div class="chart-wrap">
                        <canvas id="totalChart" aria-label="Total stats chart" role="img"></canvas>
                    </div>
                </div>

                <div class="panel wide">
                    <h2>Previous Workouts</h2>
                    <div id="workoutCards" class="card-container"></div>
                </div>
            </section>
        </main>
</div>

    <!-- HAMBURGER for mobile -->
    <button id="hamburger" class="hamburger" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>

    <!-- Add Workout Button -->
  <button id="addWorkoutBtn" class="add-button" aria-label="Add workout">
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  </button>

  <!-- ADD WORKOUT MODAL -->
  <div id="addWorkoutModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="addWorkoutTitle">
    <div class="modal-panel">
      <h3 id="addWorkoutTitle">Add Workout</h3>

      <label class="field">
        <span>Date</span>
        <input id="addDate" type="date" />
      </label>

      <div id="exerciseList" class="exercise-list">
        <div class="exercise-row">
          <input placeholder="Exercise name" class="ex-name" />
          <input type="number" min="0" placeholder="Sets" class="ex-sets" />
          <input type="number" min="0" placeholder="Reps" class="ex-reps" />
          <input type="number" min="0" placeholder="Weight (lbs)" class="ex-weight" />
        </div>
        <div class="exercise-row">
          <input placeholder="Exercise name" class="ex-name" />
          <input type="number" min="0" placeholder="Sets" class="ex-sets" />
          <input type="number" min="0" placeholder="Reps" class="ex-reps" />
          <input type="number" min="0" placeholder="Weight (lbs)" class="ex-weight" />
        </div>
        <div class="exercise-row">
          <input placeholder="Exercise name" class="ex-name" />
          <input type="number" min="0" placeholder="Sets" class="ex-sets" />
          <input type="number" min="0" placeholder="Reps" class="ex-reps" />
          <input type="number" min="0" placeholder="Weight (lbs)" class="ex-weight" />
        </div>
      </div>

      <div class="modal-actions">
        <button id="saveWorkout" class="btn primary">Save</button>
        <button id="cancelAdd" class="btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- DETAILS MODAL -->
  <div id="detailsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
    <div class="modal-panel" id="detailsPanel">
      <h3 id="detailsTitle">Workout Details</h3>
      <div id="detailsBody"></div>
      <div class="modal-actions">
        <button id="closeDetails" class="btn">Close</button>
      </div>
    </div>
  </div>

  
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="./profile.js"></script>
</body>

</html>
