<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <!-- SAME CSS AS ALL OTHER PAGES -->
    <link rel="stylesheet" href="default.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="calendar.css">

    <link rel="manifest" href="pwa-manifest.json">
</head>

<body>

<!-- HAMBURGER MENU (MATCHING YOUR OTHER PAGES) -->
<button id="menu-toggle">☰</button>

<!-- SIDEBAR (COPIED FROM YOUR WORKING PAGE) -->
<div id="sidebar">
    <img src="icons/logo.png" id="sidebar-logo" alt="POWR Logo">

    <a href="profile.html" class="navBarButton">Profile</a>
    <a href="workout.html" class="navBarButton">Workout</a>
    <a href="Calendar.html" class="navBarButton" style="color:#ff4444;">Calendar</a>
    <a href="inventory.html" class="navBarButton">Inventory</a>
    <a href="resources.html" class="navBarButton">Resources</a>
    <a href="community.html" class="navBarButton">Community</a>
    <a href="coach.html" class="navBarButton">Coach</a>
</div>

<!-- MAIN CONTENT WRAPPER -->
<div id="content">

    <main class="calendar-page">
        <section class="calendar-container">

            <header class="calendar-header">
                <button id="prevMonth" type="button">‹</button>
                <h2 id="monthYear"></h2>
                <button id="nextMonth" type="button">›</button>
            </header>

            <!-- WEEKDAY HEADERS -->
            <div class="weekday-row">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>

            <!-- CALENDAR DAYS (injected by JS) -->
            <div class="calendar-grid" id="calendarGrid"></div>

        </section>
    </main>

</div>

<!-- JAVASCRIPT -->
<script src="calendar.js"></script>

<!-- OPTIONAL: If your sidebar toggle code is inside profile.js, load it -->
<script src="profile.js"></script>

<script>
    // If your other pages use a toggle script, this ensures Calendar works too.
    const menu = document.getElementById("sidebar");
    const toggle = document.getElementById("menu-toggle");

    if (toggle) {
        toggle.addEventListener("click", () => {
            menu.classList.toggle("open");
        });
    }
</script>

</body>
</html>
