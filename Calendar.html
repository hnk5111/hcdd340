<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar</title>

    <!-- base project css (do not edit) -->
    <link rel="stylesheet" href="default.css" />

    <!-- page css -->
    <link rel="stylesheet" href="calendar.css" />
    <link rel="stylesheet" href="previousWorkoutsCarousel.css" />

    <link rel="manifest" href="pwa-manifest.json" />

    <script src="calendar.js" defer></script>
</head>

<body class="calendar">
<!-- Hamburger (mobile only) -->
<button id="hamburger" class="hamburger" type="button" aria-label="Open menu">☰</button>

<div class="layout">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
        <div class="brand">
            <!-- IMPORTANT: this path must match your real logo file -->
            <img src="my-icons/powrlogo.png" alt="POWR Logo" class="sidebar-logo" />
        </div>

        <nav class="navlinks">
            <a href="profile.html" class="navbtn">Profile</a>
            <a href="workout.html" class="navbtn">Workout</a>
            <a href="Calendar.html" class="navbtn active">Calendar</a>
            <a href="inventory.html" class="navbtn">Inventory</a>
            <a href="resources.html" class="navbtn">Resources</a>
            <a href="community.html" class="navbtn">Community</a>
            <a href="coach.html" class="navbtn">Coach</a>
            <a href="inventoryBetter.html" class="navbtn">Inventory</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="app">
        <section class="calendar-container">
            <header class="calendar-header">
                <button id="prevMonth" type="button" aria-label="Previous month">‹</button>
                <h2 id="monthYear"></h2>
                <button id="nextMonth" type="button" aria-label="Next month">›</button>
            </header>

            <div class="weekday-row" aria-hidden="true">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>

            <div class="calendar-grid" id="calendarGrid"></div>

            <p class="calendar-hint">
                Tip: click a day to add a quick note. <b>Shift + click</b> a day to add a real workout.
            </p>
        </section>

        <!-- Previous Workouts (same data as Profile) -->
        <section class="previous-workouts">
            <h3>Previous Workouts</h3>
            <div id="workoutCards" class="workout-cards"></div>
        </section>
    </main>
</div>

<!-- Floating + (moved from Profile to Calendar) -->
<button id="addWorkoutBtn" class="fab" type="button" aria-label="Add workout">+</button>

<!-- ADD WORKOUT MODAL -->
<div id="addWorkoutModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="addWorkoutTitle">
    <div class="modal-content">
        <h3 id="addWorkoutTitle">Add Workout</h3>

        <label class="field">
            <span>Date</span>
            <input id="addDate" type="date" />
        </label>

        <label class="field">
            <span>Wilks Score (optional)</span>
            <input id="addWilks" type="number" step="1" placeholder="e.g. 285" />
        </label>

        <label class="field">
            <span>Exercises (comma separated)</span>
            <input id="addExercises" type="text" placeholder="Squat, Bench, Deadlift" />
        </label>

        <div class="modal-actions">
            <button id="cancelAdd" type="button" class="btn secondary">Cancel</button>
            <button id="saveWorkout" type="button" class="btn primary">Save</button>
        </div>
    </div>
</div>

<!-- DETAILS MODAL -->
<div id="detailsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
    <div class="modal-content">
        <h3 id="detailsTitle">Workout</h3>
        <div id="detailsBody" class="details-body"></div>

        <div class="modal-actions">
            <button id="closeDetails" type="button" class="btn primary">Close</button>
        </div>
    </div>
</div>
</body>
</html>
