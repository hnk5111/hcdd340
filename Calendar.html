<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar</title>

    <link rel="stylesheet" href="default.css" />
    <link rel="stylesheet" href="calendar.css" />

    <script src="calendar.js" defer></script>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
        <div class="sidebar-inner">
            <div class="brand">
                <img width="250" src="my-icons/powrlogo.png" alt="POWR Logo">
            </div>

            <nav class="navlinks">
                <a href="profile.html" class="navbtn">Profile</a>
                <a href="workout.html" class="navbtn">Workout</a>
                <a href="Calendar.html" class="navbtn" style="opacity:0.7;">Calendar</a>
                <a href="inventory.html" class="navbtn">Inventory</a>
                <a href="resources.html" class="navbtn">Resources</a>
                <a href="community.html" class="navbtn">Community</a>
                <a href="coach.html" class="navbtn">Coach</a>
            </nav>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="app" role="main">

        <div class="calendar-page">
            <section class="calendar-container">

                <header class="calendar-header">
                    <button id="prevMonth" type="button">‹</button>
                    <h2 id="monthYear"></h2>
                    <button id="nextMonth" type="button">›</button>
                </header>

                <div class="weekday-row">
                    <span>Sun</span>
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                </div>

                <div id="calendarGrid" class="calendar-grid"></div>

            </section>
        </div>

        <!-- FLOATING + BUTTON -->
        <button id="fab-add" class="fab">+</button>

    </main>

</div>

<!-- HAMBURGER MENU -->
<button id="hamburger" class="hamburger">
    <span></span><span></span><span></span>
</button>

</body>
</html>
